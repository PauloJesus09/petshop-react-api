spring.application.name=api
server.port=8080

# -------- Banco de dados (MySQL) --------
# Antes de rodar a aplicacao, crie o banco executando o script.sql
# (arquivo na raiz do modulo api/), que cria o schema "petshop_db"
# e a tabela "pets".
spring.datasource.url=jdbc:mysql://localhost:3306/petshop?useTimezone=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Nao usamos JPA/Hibernate (o projeto usa apenas JdbcTemplate),
# entao nao ha auto-criacao de schema por ORM. A tabela e criada
# manualmente a partir do script.sql.

# -------- Logs --------
logging.level.org.springframework.jdbc.core=INFO